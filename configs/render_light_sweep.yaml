# Render a rotating-light sweep:
#   python render_light_sweep.py material=fabric_hex chkpt=runs/fabric_hex_detail/latest/checkpoint.pkl
defaults:
  - material: fabric_hex
  - data: captures
  - _self_

# folder holding the released captures (default: $MESOSCALE_DATA or ~/.cache/mesoscale)
data_root: null
chkpt: ???
# Initial camera and light pose from this sweep view.
view: 91
image_scale: 0.4
# Sample-plane half-extent in mm; UV coordinates span the full rectangle.
plate_scale: 70
# Rotate the light about the sample normal by angle degrees.
frames: 90
angle: 90.0
spp: 256
# Linear exposure multiplier before clipping and sRGB encoding.
exposure: 1.0
name: ${material.name}_light_sweep

hydra:
  run:
    dir: runs/${name}/${now:%Y-%m-%d_%H-%M-%S}
