# Renders a trained checkpoint over the material's sweep views (render_sweep.py):
#   python render_sweep.py material=fabric_hex chkpt=runs/fabric_hex_detail/latest/checkpoint.pkl
defaults:
  - material: fabric_hex
  - data: captures
  - _self_

# folder holding the released captures (default: $MESOSCALE_DATA or ~/.cache/mesoscale)
data_root: null
chkpt: ???
# Rendering backend: mitsuba or torch.
renderer: mitsuba
# Central crop as a percentage of the material width: 100, 25, or 20.
crop: "100"
spp: 64
# View range [first, last); null includes all remaining views.
first: 0
last: null
# Linear exposure multiplier before clipping and sRGB encoding.
exposure: 1.0
name: ${material.name}_sweep

hydra:
  run:
    dir: runs/${name}/${now:%Y-%m-%d_%H-%M-%S}
