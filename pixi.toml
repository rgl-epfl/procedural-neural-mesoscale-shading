[workspace]
name = "mesoscale"
description = "Training and rendering of the mesoscale material model"
channels = ["conda-forge"]
platforms = ["linux-64"]

[tasks]
train = "python train.py"
render_sweep = "python render_sweep.py"

[dependencies]
python = "3.12.*"

[pypi-dependencies]
mitsuba = "==3.8.0"
drjit = "==1.3.1"
numpy = ">=2.1,<3"
hydra-core = ">=1.3,<2"
omegaconf = ">=2.3,<3"
orjson = ">=3.11,<4"
tqdm = ">=4.67,<5"

# PyTorch's CUDA build: cu129 (default; current GPUs such as Blackwell) or cu126
# (drivers older than 12.8, e.g. 560): pixi run -e cu126 train ...
[feature.cu129.pypi-dependencies]
torch = { version = "==2.11.0", index = "https://download.pytorch.org/whl/cu129" }
torchvision = { version = "==0.26.0", index = "https://download.pytorch.org/whl/cu129" }

[feature.cu126.pypi-dependencies]
torch = { version = "==2.11.0", index = "https://download.pytorch.org/whl/cu126" }
torchvision = { version = "==0.26.0", index = "https://download.pytorch.org/whl/cu126" }

[environments]
default = { features = ["cu129"], solve-group = "cu129" }
cu126 = { features = ["cu126"], solve-group = "cu126" }
